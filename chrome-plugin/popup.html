<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
      padding: 12px;
    }

    .card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .header {
      background: linear-gradient(135deg, #f97316, #ea580c);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .header-text h1 { color: white; font-size: 14px; font-weight: 700; }
    .header-text p { color: rgba(255,255,255,0.75); font-size: 11px; margin-top: 1px; }

    .body { padding: 14px 16px; }

    .page-info {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      background: #f9fafb;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      margin-bottom: 12px;
    }

    .page-favicon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .page-title {
      font-size: 12px;
      font-weight: 600;
      color: #111827;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .page-url {
      font-size: 10px;
      color: #9ca3af;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .clip-types {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }

    .clip-type {
      padding: 8px 6px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .clip-type:hover { border-color: #f97316; background: #fff7ed; }

    .clip-type.active {
      border-color: #f97316;
      background: #fff7ed;
      color: #c2410c;
    }

    .clip-type .icon { font-size: 18px; display: block; margin-bottom: 3px; }
    .clip-type .name { font-size: 10px; font-weight: 600; color: #374151; }
    .clip-type.active .name { color: #c2410c; }

    .preview {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11px;
      color: #6b7280;
      line-height: 1.5;
      max-height: 60px;
      overflow: hidden;
      margin-bottom: 12px;
      position: relative;
    }

    .preview::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 24px;
      background: linear-gradient(transparent, #f9fafb);
    }

    input[type="text"], textarea {
      width: 100%;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: #111827;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
      resize: none;
    }

    input[type="text"]:focus, textarea:focus { border-color: #f97316; }

    .field { margin-bottom: 10px; }

    .btn-save {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      margin-top: 4px;
    }

    .btn-save:hover { opacity: 0.9; }
    .btn-save:active { transform: scale(0.98); }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

    .footer {
      border-top: 1px solid #f3f4f6;
      padding: 10px 16px;
      display: flex;
      gap: 8px;
    }

    .footer a {
      flex: 1;
      padding: 7px;
      text-align: center;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 7px;
      text-decoration: none;
      color: #6b7280;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s;
    }

    .footer a:hover { background: #fff7ed; border-color: #f97316; color: #ea580c; }

    .status {
      margin: 8px 0 0;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      display: none;
    }

    .status.success {
      display: block;
      background: #d1fae5;
      color: #047857;
      border: 1px solid #6ee7b7;
    }

    .status.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .loading { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="header-icon">✂️</div>
      <div class="header-text">
        <h1>Web Clipper</h1>
        <p>Content Intelligence OS · Segundo Cérebro</p>
      </div>
    </div>

    <div class="body" id="body">
      <div class="page-info" id="pageInfo">
        <img class="page-favicon" id="favicon" src="" alt="" />
        <div style="min-width:0">
          <div class="page-title" id="pageTitle">Carregando...</div>
          <div class="page-url" id="pageUrl"></div>
        </div>
      </div>

      <label>Tipo de clip</label>
      <div class="clip-types">
        <div class="clip-type active" data-type="article" onclick="setType('article')">
          <span class="icon">📄</span>
          <span class="name">Artigo</span>
        </div>
        <div class="clip-type" data-type="selection" onclick="setType('selection')" id="selectionBtn">
          <span class="icon">✍️</span>
          <span class="name">Seleção</span>
        </div>
        <div class="clip-type" data-type="full_page" onclick="setType('full_page')">
          <span class="icon">🌐</span>
          <span class="name">Página</span>
        </div>
      </div>

      <label>Prévia do conteúdo</label>
      <div class="preview" id="preview">Carregando conteúdo...</div>

      <div class="field">
        <label>Tags <span style="font-weight:400;text-transform:none;color:#9ca3af">(separe por vírgula)</span></label>
        <input type="text" id="tags" placeholder="ex: marketing, estratégia, referência" />
      </div>

      <div class="field">
        <label>Nota rápida</label>
        <textarea id="notes" rows="2" placeholder="Por que você está salvando isso?"></textarea>
      </div>

      <button class="btn-save" id="saveBtn" onclick="saveClip()">
        ✂️ Salvar no Segundo Cérebro
      </button>

      <div class="status" id="status"></div>
    </div>

    <div class="footer">
      <a href="http://localhost:5173/clipper" target="_blank">📚 Ver Clips</a>
      <a href="http://localhost:5173/" target="_blank">🏠 Dashboard</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
