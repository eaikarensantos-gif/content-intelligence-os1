<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Web Clipper</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:340px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff7ed;padding:10px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.1)}
.hdr{background:linear-gradient(135deg,#f97316,#ea580c);padding:12px 14px;display:flex;align-items:center;gap:10px}
.hdr-icon{width:28px;height:28px;background:rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.hdr-text h1{color:#fff;font-size:13px;font-weight:700}
.hdr-text p{color:rgba(255,255,255,.75);font-size:10px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.bdy{padding:12px 14px}
.page-info{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:10px}
.page-favicon{width:20px;height:20px;border-radius:4px;flex-shrink:0;margin-top:1px}
.page-favicon-ph{width:20px;height:20px;border-radius:4px;background:#e5e7eb;flex-shrink:0}
.page-meta{overflow:hidden}
.page-title{font-size:11px;font-weight:600;color:#111827;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.page-host{font-size:10px;color:#9ca3af;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section-label{font-size:10px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.types{display:flex;gap:6px;margin-bottom:10px}
.type-btn{flex:1;padding:6px 4px;border:1.5px solid #e5e7eb;border-radius:8px;background:#fff;font-size:11px;font-weight:600;color:#6b7280;cursor:pointer;text-align:center;transition:all .15s}
.type-btn:hover{border-color:#f97316;color:#f97316}
.type-btn.active{border-color:#f97316;background:#fff7ed;color:#ea580c}
.field{margin-bottom:10px}
input.inp,textarea.inp{width:100%;border:1.5px solid #e5e7eb;border-radius:8px;padding:7px 9px;font-size:12px;color:#374151;outline:none;font-family:inherit;resize:none;transition:border-color .15s}
input.inp:focus,textarea.inp:focus{border-color:#f97316}
.inp::placeholder{color:#d1d5db}
#selection-preview{background:#f5f3ff;border:1.5px solid #ddd6fe;border-radius:8px;padding:7px 9px;font-size:11px;color:#4c1d95;line-height:1.4;max-height:60px;overflow:hidden;margin-bottom:10px;font-style:italic;display:none}
.save-btn{display:block;width:100%;padding:10px;border:none;border-radius:10px;background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s}
.save-btn:hover{opacity:.9}
.save-btn:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:8px;padding:7px 10px;border-radius:8px;font-size:11px;font-weight:600;display:none;text-align:center}
.ok{display:block;background:#d1fae5;color:#047857;border:1px solid #6ee7b7}
.err{display:block;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.ftr{border-top:1px solid #f3f4f6;padding:9px 14px}
.ftr a{display:block;text-align:center;padding:6px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:7px;text-decoration:none;color:#6b7280;font-size:11px;font-weight:600}
.ftr a:hover{background:#fff7ed;border-color:#f97316;color:#ea580c}
#loading{padding:20px;text-align:center;color:#9ca3af;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <div class="hdr">
    <div class="hdr-icon">&#x2702;</div>
    <div class="hdr-text">
      <h1 id="hdr-title">Web Clipper</h1>
      <p id="hdr-sub">Carregando...</p>
    </div>
  </div>
  <div id="loading">&#x23F3; Carregando...</div>
  <div id="main" style="display:none">
    <div class="bdy">
      <div class="page-info">
        <img id="fav" class="page-favicon" src="" alt="">
        <div id="fav-ph" class="page-favicon-ph" style="display:none"></div>
        <div class="page-meta">
          <div class="page-title" id="pg-title"></div>
          <div class="page-host" id="pg-host"></div>
        </div>
      </div>

      <div class="section-label">Tipo</div>
      <div class="types">
        <button class="type-btn active" id="t-article">&#x1F4D6; Artigo</button>
        <button class="type-btn" id="t-full_page">&#x1F310; P&#xE1;gina</button>
        <button class="type-btn" id="t-selection">&#x1F4CC; Sele&#xE7;&#xE3;o</button>
      </div>

      <div id="selection-preview"></div>

      <div class="field">
        <div class="section-label">Tags (separadas por v&#xED;rgula)</div>
        <input class="inp" type="text" id="tags" placeholder="ex: marketing, refer&#xEA;ncia, viral">
      </div>

      <div class="field">
        <div class="section-label">Nota</div>
        <textarea class="inp" id="notes" rows="2" placeholder="O que me chamou aten&#xE7;&#xE3;o nesse conte&#xFA;do..."></textarea>
      </div>

      <button class="save-btn" id="save-btn">&#x2702; Salvar no segundo c&#xE9;rebro</button>
      <div class="msg" id="msg"></div>
    </div>
    <div class="ftr">
      <a href="https://content-intelligence-os1.vercel.app/clipper" target="_blank">&#x1F4CB; Ver todos os clips</a>
    </div>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
